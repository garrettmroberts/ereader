; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Host tests (no upload): pio test -e native

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps =
    zinggjm/GxEPD2

upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
test_ignore = *

; sd_demo.cpp has its own setup/loop. Keep it out of the reader firmware.
build_src_filter = +<*> -<sd_demo.cpp>

; Flash the card check, then watch the serial log for PASS:
;   pio run -e sd_demo -t upload && pio device monitor
[env:sd_demo]
extends = env:esp32dev
build_src_filter = +<sd_demo.cpp>
build_flags = -DCORE_DEBUG_LEVEL=2

[env:native]
platform = native
test_framework = unity
test_build_src = false
lib_deps = throwtheswitch/Unity@^2.6.1
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -Iinclude
    -Ihost/fakes
    -Ihost/miniz
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-unused-function
    -Wno-unused-variable
    -lz
